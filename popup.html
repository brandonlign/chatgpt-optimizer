<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Optimizer</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #f5f5f5;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 17px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 0;
        font-size: 14px;
      }

      input {
        width: 16px;
        height: 16px;
      }

      .note {
        margin-top: 10px;
        color: #aaa;
        font-size: 12px;
        line-height: 1.35;
      }

      #status {
        min-height: 16px;
        margin-top: 8px;
        color: #9ad6b4;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>ChatGPT Optimizer</h1>

    <label>
      <input id="reduceBlur" type="checkbox" />
      Remove background blur
    </label>

    <label>
      <input id="optimizeSidebar" type="checkbox" />
      Optimize sidebar conversations
    </label>

    <label>
      <input id="reduceAnimations" type="checkbox" />
      Reduce animations
    </label>

    <label>
      <input id="reduceShadows" type="checkbox" />
      Remove shadows
    </label>

    <div class="note">Off-screen message optimization is always enabled. Aggressive options are off by default.</div>
    <div id="status" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
