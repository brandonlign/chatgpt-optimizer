<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Optimizer</title>
    <style>
      body {
        width: 290px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #f5f5f5;
      }

      .heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 17px;
      }

      #version {
        color: #9ad6b4;
        font-size: 12px;
        font-weight: 700;
      }

      .status {
        margin: 14px 0 8px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 13px;
        font-weight: 650;
      }

      .note {
        color: #aaa;
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="heading">
      <h1>ChatGPT Optimizer</h1>
      <span id="version"></span>
    </div>

    <div class="status">Long-chat safe mode enabled</div>
    <div class="note">
      Conversation turns are hidden during initial loading. The newest 30 turns are then shown, with in-page controls to reveal more. The loader stops scanning after startup.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
