name: BlindSlope network runner

on:
  push:
    branches: [pilot/blindslope-runner]
  pull_request:
    branches: [main]
    paths: [.github/workflows/blindslope-runner.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query real NISAR catalogues
        shell: bash
        run: |
          mkdir -p results/raw
          cat > /tmp/run.py <<'PY'
          import csv, json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          OUT=Path('results'); RAW=OUT/'raw'
          AOI='88.55,27.25,88.72,27.40'
          TEMP='2026-06-17T00:00:00Z,2026-07-30T00:00:00Z'
          COLLECTIONS=[
            'NISAR_L2_GUNW_PROVISIONAL_V1',
            'NISAR_L1_RIFG_PROVISIONAL_V1',
            'NISAR_L2_GSLC_PROVISIONAL_V1',
            'NISAR_L2_GCOV_PROVISIONAL_V1',
          ]
          HEAD={'User-Agent':'BlindSlope-Pilot/0.2','Client-Id':'BlindSlope-Pilot','Accept':'application/json'}

          def request(url, data=None, headers=None):
              h=dict(HEAD); h.update(headers or {})
              req=urllib.request.Request(url, data=data, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, r.geturl(), dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.geturl(), dict(e.headers), e.read()

          rows=[]; collection_summary={}
          for short in COLLECTIONS:
              q=urllib.parse.urlencode({'short_name':short,'page_size':20})
              status,url,headers,body=request('https://cmr.earthdata.nasa.gov/search/collections.umm_json?'+q)
              (RAW/f'collection_{short}.json').write_bytes(body)
              if status != 200:
                  collection_summary[short]={'collection_status':status,'count':-1}; continue
              payload=json.loads(body); items=payload.get('items',[])
              asf=[x for x in items if x.get('meta',{}).get('provider-id')=='ASF']
              item=(asf or items)[0] if items else None
              if not item:
                  collection_summary[short]={'collection_status':status,'count':0,'error':'collection missing'}; continue
              cid=item['meta']['concept-id']
              params={'concept_id':cid,'bounding_box':AOI,'temporal':TEMP,'page_size':2000,'sort_key[]':'start_date'}
              gstatus,gurl,gheaders,gbody=request('https://cmr.earthdata.nasa.gov/search/granules.umm_json?'+urllib.parse.urlencode(params))
              (RAW/f'granules_{short}.json').write_bytes(gbody)
              if gstatus != 200:
                  collection_summary[short]={'concept_id':cid,'granule_status':gstatus,'count':-1}; continue
              gp=json.loads(gbody); granules=gp.get('items',[])
              collection_summary[short]={'concept_id':cid,'granule_status':gstatus,'cmr_hits':int(gheaders.get('CMR-Hits','-1')),'count':len(granules)}
              for x in granules:
                  meta=x.get('meta',{}); umm=x.get('umm',{})
                  temporal=umm.get('TemporalExtent',{}).get('RangeDateTime',{})
                  urls=umm.get('RelatedUrls',[]) or []
                  rows.append({
                    'collection':short,
                    'concept_id':meta.get('concept-id'),
                    'granule_id':umm.get('GranuleUR') or meta.get('native-id'),
                    'start_time':temporal.get('BeginningDateTime'),
                    'end_time':temporal.get('EndingDateTime'),
                    'related_urls':json.dumps(urls,separators=(',',':')),
                  })

          fields=['collection','concept_id','granule_id','start_time','end_time','related_urls']
          with (OUT/'l_band_granules.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          s_payload=json.dumps({'collections':['NISAR_SSAR_GUNW'],'bbox':[88.55,27.25,88.72,27.40],
                                'datetime':'2026-07-08T00:00:00Z/2026-07-30T00:00:00Z','limit':500}).encode()
          sstatus,surl,sheaders,sbody=request('https://bhoonidhi-api.nrsc.gov.in/data/search',s_payload,{'Content-Type':'application/json'})
          (RAW/'bhoonidhi_gunw_response.txt').write_bytes(sbody)

          gunw=sum(1 for r in rows if r['collection']=='NISAR_L2_GUNW_PROVISIONAL_V1')
          rifg=sum(1 for r in rows if r['collection']=='NISAR_L1_RIFG_PROVISIONAL_V1')
          dates=sorted({str(r['start_time'])[:10] for r in rows if r['start_time']})
          l_gate=(gunw>=2 or rifg>=2)
          verdict='L_GATE_PASS_S_ACCESS_BLOCKED' if l_gate and sstatus in (401,403) else ('CATALOG_GATE_PASS' if l_gate and sstatus==200 else 'L_GATE_FAIL')
          summary={
            'pilot':'BlindSlope','stage':'catalog_access_gate','synthetic_data_used':False,
            'aoi':[88.55,27.25,88.72,27.40],'temporal':['2026-06-17','2026-07-30'],
            'collections':collection_summary,'l_band_total':len(rows),'l_gunw_count':gunw,'l_rifg_count':rifg,
            'l_acquisition_dates':dates,'s_band_http_status':sstatus,'s_band_body_prefix':sbody[:1000].decode('utf-8','replace'),
            'l_interferometric_gate':l_gate,'verdict':verdict,
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          python /tmp/run.py | tee results/run.log
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindslope-network-results
          path: results
          if-no-files-found: error
